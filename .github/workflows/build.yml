name: test-and-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Publishing is an explicit maintainer step with gh release create.
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - run: python -m pip install -r requirements.txt -r requirements-build.txt pytest==9.1.1
      - run: xvfb-run -a python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Create isolated build environment
        shell: pwsh
        run: python -m venv .venv-build
      - name: Build Windows release assets
        shell: pwsh
        run: |
          $expected = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./scripts/build_windows.ps1 -PythonPath ./.venv-build/Scripts/python.exe -InstallDependencies -ExpectedVersion $expected
      - name: Smoke-test packaged Windows app
        shell: pwsh
        timeout-minutes: 2
        run: |
          $taskExe = Join-Path $env:GITHUB_WORKSPACE 'dist/release/MLAFMT.exe'
          $taskSmoke = Start-Process -FilePath $taskExe -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($taskSmoke.ExitCode -ne 0) { throw "Packaged app smoke test failed ($($taskSmoke.ExitCode))." }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MLAFMT-windows-${{ github.ref_name }}
          path: |
            dist/release/MLAFMT.exe
            dist/release/MLAFMT-v*-windows-x64.zip
            dist/release/SHA256SUMS.txt
            dist/release/build-info.json
          if-no-files-found: error
          retention-days: 14
